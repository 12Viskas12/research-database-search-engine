name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: |
          pip install ruff
          ruff check .
      - name: Compile
        run: python -m compileall -q app bot workers
      - name: Check frontend script
        run: node --check app/static/app.js
      - name: Validate compose file
        run: docker compose config -q
      - name: Build images
        run: docker compose build
